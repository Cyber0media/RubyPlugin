name: Build RubyPlugin JAR

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu indir
        uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Maven ile derle
        run: mvn -B clean package

      - name: JAR dosyasini artifact olarak yukle
        uses: actions/upload-artifact@v4
        with:
          name: RubyPlugin-jar
          path: target/RubyPlugin.jar
